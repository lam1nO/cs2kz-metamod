name: Build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch tags
        run: git fetch --no-recurse-submodules --prune --unshallow --tags

      - name: Ticket eligibility host test
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/cyb_ticket_eligibility_test.cpp -o /tmp/ticket-test && /tmp/ticket-test
          c++ -std=c++17 -Wall -Wextra -Werror tests/cyb_ticket_lease_test.cpp -o /tmp/lease-test && /tmp/lease-test
          c++ -std=c++17 -Wall -Wextra -Werror -I . tests/analytics_source_identity_test.cpp -o /tmp/source-test && /tmp/source-test

      - name: Make build directory
        run: mkdir ./build

      - name: Update version header
        run: |
          sed -i 's/"version": "0.0.0-dev"/"version": "${{ inputs.version }}"/' ./plugin-metadata.json

      - name: Build and run Docker image
        run: |
          docker build . --file Dockerfile --tag cs2kz-linux-builder
          docker run -v ./build:/app/build -v ./.git:/app/.git cs2kz-linux-builder

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: cs2kz-linux
          path: ./build/package

  build-windows:
    name: Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Fetch tags
        run: git fetch --no-recurse-submodules --prune --unshallow --tags

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip
        shell: cmd
        run: curl https://bootstrap.pypa.io/pip/3.6/get-pip.py | python

      - name: Clone AMBuild
        uses: actions/checkout@v6
        with:
          repository: alliedmodders/ambuild
          path: ./ambuild

      - name: Install AMBuild
        run: python -m pip install ./ambuild

      - name: Make build directory
        run: mkdir ./build

      - name: Configure AMBuild
        working-directory: build
        run: python3 ../configure.py --enable-optimize

      - name: Update version header
        shell: bash
        run: |
          sed -i 's/"version": "0.0.0-dev"/"version": "${{ inputs.version }}"/' ./plugin-metadata.json

      - name: Run AMBuild
        working-directory: build
        run: ambuild

      - name: Archive build
        uses: actions/upload-artifact@v7
        with:
          name: cs2kz-windows
          path: ./build/package
